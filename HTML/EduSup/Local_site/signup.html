<main>
<h1>Sign up</h1>
<form action="#" method="post">
<p>
<label for="firstname">Enter your first name</label><br>
<input type="text" id="firstname" name="firstname" minlength="3" required>
</p>
<p>
<label for="lastname">Enter your last name</label><br>
<input type="text" id="lastname" name="lastname" minlength="3" required>
</p>
<p>
<label for="dob">Date of birth</label><br>
<input type="date" id="dob" name="dob" required>
</p>
<p>
<label for="phone">Phone number</label><br>
<input type="tel" id="phone" name="phone" pattern="[0-9]+" title="Digits only, no letters" required>
</p>
<p>
<label for="email">Email</label><br>
<input type="email" id="email" name="email" placeholder="yourname@supcom.tn" pattern="[a-zA-Z0-9._%+-]+@supcom\.tn" title="Only @supcom.tn email addresses are allowed" required>
</p>
<p>
<label for="password">Password</label><br>
<input type="password" id="password" name="password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" title="At least 8 characters, including lowercase, uppercase, a number and a symbol" required>
</p>
<p>
<label for="confirmpassword">Confirm password</label><br>
<input type="password" id="confirmpassword" name="confirmpassword" required>
</p>
<p>
I am a:<br>
<input type="radio" id="teacher" name="role" value="teacher">
<label for="teacher">Teacher</label>
<input type="radio" id="student" name="role" value="student" checked>
<label for="student">Student</label>
</p>
<p>
<button type="submit">Sign up</button>
</p>
</form>
</main>
